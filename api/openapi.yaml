openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Telomoyo POS API
  version: 1.0.0
  summary: Local-first point-of-sale API for Telomoyo's isolated business units.
  description: |
    The contract used by the Android terminal and the Go backend. Money is integer
    Indonesian rupiah, timestamps are RFC 3339, reporting uses Asia/Jakarta, and
    transaction IDs are raw ULIDs. User-facing surfaces add the `TRX-` prefix.

    Unless a response is a downloadable export, successful JSON responses use
    `{data, meta}` and errors use `{error: {code, message, details, requestId}}`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Version 1 API
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness and dependency readiness.
  - name: Authentication
    description: Login, password lifecycle, logout, and current profile.
  - name: Sandbox
    description: Production-hosted test data-space status, switching, and lifecycle.
  - name: Users
    description: Legacy tenant-scoped member projections; obsolete mutations require an app upgrade.
  - name: Tenants
    description: Selected business-unit identity and merchant QRIS. Every active account can select every active tenant.
  - name: Platform
    description: Retired platform administration interfaces retained for upgrade responses.
  - name: Management
    description: Organization-wide tenant and staff administration by a global Superadmin from an authenticated account or selected-tenant context.
  - name: Packages
    description: Package catalog and revision management.
  - name: Transactions
    description: Sales, corrections, deletion, and print attempt history.
  - name: Statistics
    description: Jakarta-local dashboard aggregates.
  - name: Exports
    description: Online-only transaction exports.
  - name: Terminals
    description: Physical installation enrollment and revocation.
  - name: Synchronization
    description: Idempotent signed mutation push and cursor-based change pull.

paths:
  /auth/contexts:
    get:
      operationId: getAuthContexts
      tags: [Authentication]
      summary: List active business units and organization-management capabilities
      responses:
        "200":
          description: All active tenants are available to every active account; roles are organization-wide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableContextsEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/switch-context:
    post:
      operationId: switchAuthContext
      tags: [Authentication]
      summary: Exchange the session into account or selected tenant context
      description: Tenant context always starts in Production. Requires online outbox drainage or explicit quarantine after revoked access. The previous session is revoked and retained as immutable origin evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchContextRequest"
      responses:
        "200":
          description: The previous session remains immutable origin evidence. No new platform contexts are issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/upgrade-session:
    post:
      operationId: upgradeAuthSession
      tags: [Authentication]
      summary: Upgrade the session protocol while preserving its selected context
      description: |
        Exchange the session for protocol 3 after the client drains its current
        outbox and finishes printing. Preserve account, tenant, enrollment, mode,
        and active generation; issue transaction_total Sandbox QRIS policy.
        Retain the revoked previous session as immutable signed origin evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeSessionRequest"
      responses:
        "200":
          description: Upgraded session with the original context and negotiated payment policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /management/tenants:
    get:
      operationId: listManagedTenants
      tags: [Management]
      summary: List all business units including suspended and pending tenants
      x-required-role: superadmin
      responses:
        "200":
          description: Organization-wide tenant list for an authenticated Superadmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createManagedTenant
      tags: [Management]
      summary: Create an active business unit with an empty catalog
      description: Requires an authenticated Superadmin and enabled provisioning. Initializes the receipt identity with the management name. No invitation or membership approval is created.
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Active tenant accessible to all active staff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /management/tenants/{tenantId}:
    patch:
      operationId: updateManagedTenant
      tags: [Management]
      summary: Change a tenant's management name without changing receipt identity
      description: Authenticated Superadmin only. Requires the current management revision. Tenant ID and slug are immutable; tenant deletion is not supported.
      x-required-role: superadmin
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateManagedTenantRequest"
      responses:
        "200":
          description: Tenant with incremented management revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /management/tenants/{tenantId}/status:
    post:
      operationId: setManagedTenantStatus
      tags: [Management]
      summary: Activate, suspend, or reactivate a business unit
      description: Authenticated Superadmin only. Activation accepts an existing pending_setup tenant without an invitation. Suspension preserves data and queued evidence; reactivation never revives revoked sessions.
      x-required-role: superadmin
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTenantStatusRequest"
      responses:
        "200":
          description: Updated tenant status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /management/users:
    get:
      operationId: listManagedUsers
      tags: [Management]
      summary: List organization-wide staff accounts
      x-required-role: superadmin
      responses:
        "200":
          description: Global accounts and roles for an authenticated Superadmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUserListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createManagedUser
      tags: [Management]
      summary: Create a staff account using a temporary password
      description: Authenticated Superadmin only. The staff account must change its temporary password before operating and can subsequently select every active tenant.
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          $ref: "#/components/responses/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /management/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getManagedUser
      tags: [Management]
      summary: Get a global staff account
      x-required-role: superadmin
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateManagedUser
      tags: [Management]
      summary: Change an account's global role or active status
      description: Authenticated Superadmin only. Role changes and deactivation revoke all account sessions. Self-demotion, self-deactivation, and removing the last active Superadmin are prohibited. Account deletion is not supported.
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateManagedUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /management/users/{userId}/reset-password:
    post:
      operationId: resetManagedUserPassword
      tags: [Management]
      summary: Set a temporary password and revoke all of the account's sessions
      description: Authenticated Superadmin only. The account must change this password before operating again. Credentials are never included in audit records.
      x-required-role: superadmin
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /management/audit:
    get:
      operationId: listManagementAudit
      tags: [Management]
      summary: List durable organization-wide administrative audit history
      description: Authenticated Superadmin only. Does not expose passwords, invitation codes, or raw QRIS payloads.
      x-required-role: superadmin
      parameters:
        - $ref: "#/components/parameters/AuditLimit"
      responses:
        "200":
          description: Recent account and tenant lifecycle events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAuditListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/register-invitation:
    post:
      operationId: registerInvitation
      deprecated: true
      tags: [Authentication]
      summary: Retired invitation endpoint; all active accounts can enter every active tenant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInvitationRequest"
      responses:
        "410":
          $ref: "#/components/responses/Gone"

  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      deprecated: true
      tags: [Authentication]
      summary: Retired invitation endpoint; all active accounts can enter every active tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "410":
          $ref: "#/components/responses/Gone"

  /platform/tenants:
    get:
      operationId: listPlatformTenants
      deprecated: true
      tags: [Platform]
      summary: Retired administration endpoint; upgrade to organization management
      responses:
        "426":
          $ref: "#/components/responses/UpgradeRequired"

    post:
      operationId: createTenant
      deprecated: true
      tags: [Platform]
      summary: Retired administration endpoint; upgrade to organization management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /platform/tenants/{tenantId}/status:
    post:
      operationId: setTenantStatus
      deprecated: true
      tags: [Platform]
      summary: Retired administration endpoint; upgrade to organization management
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTenantStatusRequest"
      responses:
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /platform/tenants/{tenantId}/invitation:
    post:
      operationId: reissueOwnerInvitation
      deprecated: true
      tags: [Platform]
      summary: Retired invitation endpoint; all active accounts can enter every active tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "410":
          $ref: "#/components/responses/Gone"

  /platform/audit:
    get:
      operationId: listPlatformAudit
      deprecated: true
      tags: [Platform]
      summary: Retired administration endpoint; upgrade to organization management
      parameters:
        - $ref: "#/components/parameters/AuditLimit"
      responses:
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /tenant/members:
    get:
      operationId: listTenantMembers
      deprecated: true
      tags: [Tenants]
      summary: Retired administration endpoint; upgrade to organization management
      responses:
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /tenant/members/{userId}:
    patch:
      operationId: updateTenantMember
      deprecated: true
      tags: [Tenants]
      summary: Retired administration endpoint; upgrade to organization management
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantMemberRequest"
      responses:
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /tenant/invitations:
    get:
      operationId: listTenantInvitations
      deprecated: true
      tags: [Tenants]
      summary: Retired invitation endpoint; all active accounts can enter every active tenant
      responses:
        "410":
          $ref: "#/components/responses/Gone"

    post:
      operationId: createTenantInvitation
      deprecated: true
      tags: [Tenants]
      summary: Retired invitation endpoint; all active accounts can enter every active tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "410":
          $ref: "#/components/responses/Gone"

  /tenant/invitations/{invitationId}:
    delete:
      operationId: revokeTenantInvitation
      deprecated: true
      tags: [Tenants]
      summary: Retired invitation endpoint; all active accounts can enter every active tenant
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "410":
          $ref: "#/components/responses/Gone"

  /tenant/profile:
    get:
      operationId: getTenantProfile
      tags: [Tenants]
      summary: Get the current business receipt and report identity
      responses:
        "200":
          description: Get the current business receipt and report identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    patch:
      operationId: updateTenantProfile
      tags: [Tenants]
      summary: Create a new tenant business-profile revision
      description: Production-mode tenant superadmin only. Existing transactions retain their captured identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantProfileRequest"
      responses:
        "200":
          description: Create a new tenant business-profile revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /tenant/qris:
    get:
      operationId: getTenantQRIS
      tags: [Tenants]
      summary: Get active and historical merchant QRIS payloads for the tenant
      responses:
        "200":
          description: Get active and historical merchant QRIS payloads for the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantQRISConfigEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    put:
      operationId: updateTenantQRIS
      tags: [Tenants]
      summary: Import a merchant QRIS payload and optionally activate it
      description: Production-mode tenant superadmin only. Historical payloads remain available for exact transaction bindings. activate defaults to true; false imports only a historical payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantQRISRequest"
      responses:
        "200":
          description: Import a merchant QRIS payload and optionally activate it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantQRISConfigEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /sync/revalidate:
    post:
      operationId: revalidateSyncOrigins
      tags: [Synchronization]
      summary: Revalidate quarantined signed origins in the current tenant context
      description: Only matching active origin accounts, tenants, data spaces, and terminal enrollments are allowed. Membership IDs remain historical attribution links, not access approvals. This does not rewrite or submit signed entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevalidateOriginsRequest"
      responses:
        "200":
          description: Revalidate quarantined signed origins in the current tenant context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevalidateOriginsEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Check process liveness
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Check PostgreSQL readiness
      description: Redis failure is reported but does not make durable operations incorrect.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Start an online session
      description: First login and forced password changes require connectivity.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/switch-mode:
    post:
      operationId: switchDataMode
      tags: [Authentication]
      summary: Rotate the current session into production or Sandbox Mode
      description: |
        Online-only. The client must drain its current outbox before calling this
        endpoint. The replacement session is immutably bound to the selected data
        space and the previous session is revoked. If a Sandbox reset revoked the
        current session with `sandbox_generation_retired`, this endpoint alone may
        consume that credential once to recover into the active Sandbox generation
        or Production. Other revoked sessions remain invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchModeRequest"
      responses:
        "200":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /profile/password:
    post:
      operationId: changeOwnPassword
      tags: [Authentication]
      summary: Change the authenticated user's password
      description: Production-mode only because credentials are shared across data spaces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Revoke the current session
      description: The terminal must drain its outbox before calling this online-only endpoint.
      responses:
        "200":
          $ref: "#/components/responses/Action"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /profile:
    patch:
      operationId: updateOwnProfile
      tags: [Authentication]
      summary: Update the global account owner's name
      description: Account-owner action. Membership roles and other accounts cannot be modified here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnProfileRequest"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    get:
      operationId: getProfile
      tags: [Authentication]
      summary: Get the current user and session
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sandbox/status:
    get:
      operationId: getSandboxStatus
      tags: [Sandbox]
      summary: Get Sandbox availability and active generation
      responses:
        "200":
          $ref: "#/components/responses/SandboxStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sandbox/reset:
    post:
      operationId: resetSandbox
      tags: [Sandbox]
      summary: Retire and replace the shared Sandbox generation
      description: |
        Production-mode, superadmin-only operation. The expected generation and
        typed confirmation prevent stale or accidental resets. Active production
        packages are cloned into the replacement generation.
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetSandboxRequest"
      responses:
        "200":
          $ref: "#/components/responses/SandboxResetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      x-required-role: superadmin
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: active
          in: query
          schema:
            type: boolean
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: "#/components/responses/UserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      deprecated: true
      tags: [Users]
      summary: Retired administration endpoint; upgrade to organization management
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a user
      x-required-role: superadmin
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      deprecated: true
      tags: [Users]
      summary: Retired administration endpoint; upgrade to organization management
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "426":
          $ref: "#/components/responses/UpgradeRequired"

    delete:
      operationId: deleteUser
      deprecated: true
      tags: [Users]
      summary: Retired administration endpoint; upgrade to organization management
      x-required-role: superadmin
      responses:
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /users/{userId}/reset-password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: resetUserPassword
      deprecated: true
      tags: [Users]
      summary: Retired administration endpoint; upgrade to organization management
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /packages:
    get:
      operationId: listPackages
      tags: [Packages]
      summary: List packages
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: active
          in: query
          schema:
            type: boolean
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: "#/components/responses/PackageList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPackage
      tags: [Packages]
      summary: Create a package and its first revision
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePackageRequest"
      responses:
        "201":
          $ref: "#/components/responses/PackageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /packages/{packageId}:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: getPackage
      tags: [Packages]
      summary: Get a package and current revision
      responses:
        "200":
          $ref: "#/components/responses/PackageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePackage
      tags: [Packages]
      summary: Create a new package revision
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePackageRequest"
      responses:
        "200":
          $ref: "#/components/responses/PackageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deletePackage
      tags: [Packages]
      summary: Soft-delete a package
      x-required-role: superadmin
      responses:
        "200":
          $ref: "#/components/responses/PackageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /transactions:
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: Search transaction history
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Raw ULID or display ID beginning with TRX-.
          schema:
            type: string
            maxLength: 30
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: packageId
          in: query
          schema:
            $ref: "#/components/schemas/UUID"
        - name: creatorId
          in: query
          schema:
            $ref: "#/components/schemas/UUID"
        - name: terminalId
          in: query
          schema:
            $ref: "#/components/schemas/UUID"
        - name: paymentMethod
          in: query
          schema:
            $ref: "#/components/schemas/PaymentMethod"
        - name: paymentStatus
          in: query
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: "#/components/responses/TransactionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Create a transaction
      description: Direct online counterpart to a signed sync create mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          $ref: "#/components/responses/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /transactions/{transactionId}:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Get the current transaction and print metadata
      responses:
        "200":
          $ref: "#/components/responses/TransactionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTransaction
      tags: [Transactions]
      summary: Soft-delete a transaction
      description: Superadmin-only and online-only. There is no restore or purge endpoint in v1.
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteTransactionRequest"
      responses:
        "200":
          $ref: "#/components/responses/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /transactions/{transactionId}/revisions:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      operationId: listTransactionRevisions
      tags: [Transactions]
      summary: List immutable transaction revisions
      responses:
        "200":
          $ref: "#/components/responses/TransactionRevisionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: correctTransaction
      tags: [Transactions]
      summary: Correct a transaction by appending a revision
      description: A correction resets payment to pending for the new revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectTransactionRequest"
      responses:
        "200":
          $ref: "#/components/responses/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /transactions/{transactionId}/payment-status:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      operationId: setTransactionPaymentStatus
      tags: [Transactions]
      summary: Mark the current transaction revision payment as successful or failed
      description: |
        Legacy endpoint retained for older clients; transactions are recorded
        as payment-successful at creation since the confirmation step was
        removed. Admins may update their own transactions and superadmins may
        update any transaction. Repeating the current outcome is idempotent. A
        successful payment is final until a correction creates a new revision
        (which is again successful from the start).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPaymentStatusRequest"
      responses:
        "200":
          $ref: "#/components/responses/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PaymentStateConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /transactions/{transactionId}/print-attempts:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      operationId: listPrintAttempts
      tags: [Transactions]
      summary: List print attempts
      responses:
        "200":
          $ref: "#/components/responses/PrintAttemptList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: recordPrintAttempt
      tags: [Transactions]
      summary: Append a terminal print attempt
      description: |
        Printing is accepted only when payment succeeded for the exact current,
        non-deleted transaction revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPrintAttemptRequest"
      responses:
        "201":
          $ref: "#/components/responses/PrintAttemptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /statistics/dashboard:
    get:
      operationId: getDashboardStatistics
      tags: [Statistics]
      summary: Get dashboard aggregates
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/StatisticsPeriod"
        - name: anchor
          in: query
          description: Asia/Jakarta calendar date containing the requested period.
          schema:
            type: string
            format: date
      responses:
        "200":
          $ref: "#/components/responses/DashboardStatisticsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exports/transactions:
    post:
      operationId: exportTransactions
      tags: [Exports]
      summary: Download a filtered XLSX or PDF
      description: |
        Online-only. The caller must ensure relevant pending or conflicted local
        mutations are resolved before requesting the export. The export contains
        every payment state matching `filters`; revenue dashboard aggregation is
        separately restricted to successful payment on the current revision.
        Sandbox files and document content are permanently marked `TEST`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportTransactionsRequest"
      responses:
        "200":
          description: Generated workbook or branded PDF.
          headers:
            Content-Disposition:
              description: Download filename; Sandbox filenames begin with `TEST-`.
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /terminals/enroll:
    post:
      operationId: enrollTerminal
      tags: [Terminals]
      summary: Register a physical installation and Ed25519 public key
      description: Global Superadmin in a selected tenant's Production context only. Enrollments and signing keys are independent per tenant; this does not enroll the installation into other businesses. Admin accounts can use an existing active enrollment but cannot create or replace one.
      x-required-role: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollTerminalRequest"
      responses:
        "201":
          $ref: "#/components/responses/TerminalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /terminals/current:
    get:
      operationId: getCurrentTerminal
      tags: [Terminals]
      summary: Get the terminal bound to this session
      responses:
        "200":
          $ref: "#/components/responses/TerminalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /terminals/{terminalId}/revoke:
    parameters:
      - $ref: "#/components/parameters/TerminalId"
    post:
      operationId: revokeTerminal
      tags: [Terminals]
      summary: Revoke a terminal and its sessions
      x-required-role: superadmin
      responses:
        "200":
          $ref: "#/components/responses/TerminalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sync/push:
    post:
      operationId: pushSyncMutations
      tags: [Synchronization]
      summary: Push a FIFO batch of signed mutations
      description: |
        Each operation is idempotent. Duplicate operation IDs replay the stored
        result. Signatures cover RFC 8785 canonical JSON of the unsigned mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          $ref: "#/components/responses/SyncPush"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /sync/pull:
    get:
      operationId: pullSyncChanges
      tags: [Synchronization]
      summary: Pull ordered changes and tombstones
      parameters:
        - name: cursor
          in: query
          description: Omit only for the first pull after enrollment.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          $ref: "#/components/responses/SyncPull"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/CursorExpired"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OpaqueSessionToken
      description: Opaque 256-bit token. Only its hash is persisted by the backend.

  headers:
    RequestId:
      description: Correlation ID for logs and support.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Seconds before another attempt.
      schema:
        type: integer
        minimum: 1

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    AuditLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    PackageId:
      name: packageId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    TransactionId:
      name: transactionId
      in: path
      required: true
      description: Raw ULID without the display-only TRX- prefix.
      schema:
        $ref: "#/components/schemas/ULID"
    TerminalId:
      name: terminalId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"

  responses:
    Health:
      description: Service health.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthEnvelope"
    Login:
      description: Authenticated session.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginEnvelope"
    Action:
      description: Action result.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ActionEnvelope"
    Profile:
      description: Current profile.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileEnvelope"
    SandboxStatusResponse:
      description: Sandbox feature and generation status.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SandboxStatusEnvelope"
    SandboxResetResponse:
      description: Newly activated Sandbox generation and reset counts.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SandboxResetEnvelope"
    UserResponse:
      description: User.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserEnvelope"
    UserList:
      description: Paginated users.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserListEnvelope"
    PackageResponse:
      description: Package.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PackageEnvelope"
    PackageList:
      description: Paginated packages.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PackageListEnvelope"
    TransactionResponse:
      description: Transaction.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransactionEnvelope"
    TransactionList:
      description: Paginated transactions.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransactionListEnvelope"
    TransactionRevisionList:
      description: Immutable transaction revisions.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransactionRevisionListEnvelope"
    PrintAttemptResponse:
      description: Print attempt.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PrintAttemptEnvelope"
    PrintAttemptList:
      description: Print attempts.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PrintAttemptListEnvelope"
    DashboardStatisticsResponse:
      description: Dashboard statistics.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DashboardStatisticsEnvelope"
    TerminalResponse:
      description: Terminal.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TerminalEnvelope"
    SyncPush:
      description: Per-operation sync results in request order.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncPushEnvelope"
    SyncPull:
      description: Ordered sync changes.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncPullEnvelope"
    BadRequest:
      $ref: "#/components/responses/ErrorResponse"
    Unauthorized:
      $ref: "#/components/responses/ErrorResponse"
    Forbidden:
      $ref: "#/components/responses/ErrorResponse"
    NotFound:
      $ref: "#/components/responses/ErrorResponse"
    Conflict:
      $ref: "#/components/responses/ErrorResponse"
    RevisionConflict:
      description: Base revision is stale; details contain local and server snapshots.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RevisionConflictEnvelope"
    PaymentStateConflict:
      description: |
        The transaction revision changed or payment already succeeded. Details
        contain the authoritative current payment state and server snapshot.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaymentStateConflictEnvelope"
    UnprocessableEntity:
      $ref: "#/components/responses/ErrorResponse"
    Gone:
      description: Fitur undangan telah dihapus. Semua akun aktif dapat mengakses setiap bisnis aktif.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpgradeRequired:
      description: Perbarui aplikasi untuk menggunakan pengelolaan organisasi dan kebijakan pembayaran yang didukung.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Login rate limit exceeded.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CursorExpired:
      $ref: "#/components/responses/ErrorResponse"
    InternalError:
      $ref: "#/components/responses/ErrorResponse"
    ServiceUnavailable:
      $ref: "#/components/responses/ErrorResponse"
    ErrorResponse:
      description: Standard error envelope.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ContextKind:
      type: string
      enum: [account, tenant, platform]
      description: New sessions use account or tenant. The retired platform value is retained solely for historical session decoding.

    SandboxQrisPolicy:
      type: string
      enum: [fixed_1000, transaction_total]
      description: Immutable origin-session rule. Legacy Sandbox QRIS charges Rp1.000; protocol 3 uses the Sandbox transaction total. Historical stored payment amounts are never recalculated.

    Tenant:
      type: object
      additionalProperties: false
      required:
        [id, name, slug, status, revision, profileRevision, qrisRevision]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        status:
          type: string
          enum: [pending_setup, active, suspended]
        revision:
          type: integer
          minimum: 1
          description: Management metadata revision, independent of receipt profile and QRIS revisions.
        profileRevision:
          type: integer
          minimum: 1
        qrisRevision:
          type: [integer, "null"]
          minimum: 1

    TenantContext:
      type: object
      additionalProperties: false
      required: [tenant, membershipId, role]
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        membershipId:
          $ref: "#/components/schemas/UUID"
          description: Historical attribution link; neither role authority nor tenant access approval.
        role:
          $ref: "#/components/schemas/UserRole"
          description: The account's organization-wide role.

    AvailableContexts:
      type: object
      additionalProperties: false
      required:
        [
          tenants,
          platformAdmin,
          canManageOrganization,
          tenantProvisioningEnabled,
        ]
      properties:
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantContext"
        platformAdmin:
          type: boolean
          const: false
          deprecated: true
          description: Retained for legacy response compatibility. Use canManageOrganization instead.
        canManageOrganization:
          type: boolean
          description: True only for an active global Superadmin; management is available without leaving a selected business.
        tenantProvisioningEnabled:
          type: boolean
          description: Whether new business-unit creation is enabled. Existing tenant management remains available independently.

    SwitchContextRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [account, tenant]
        tenantId:
          $ref: "#/components/schemas/UUID"
          description: Required only when selecting tenant context.
        installationId:
          type: [string, "null"]
          format: uuid
          description: Existing physical-installation binding to look up within the selected tenant.

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true

    RegisterInvitationRequest:
      type: object
      additionalProperties: false
      required: [code, username, fullName, password]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        username:
          type: string
          minLength: 3
          maxLength: 64
        fullName:
          type: string
          minLength: 1
          maxLength: 160
        password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true

    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"

    UpdateManagedTenantRequest:
      type: object
      additionalProperties: false
      required: [name, expectedRevision]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        expectedRevision:
          type: integer
          minimum: 1

    CreateTenantResult:
      type: object
      additionalProperties: false
      required: [tenant, invitation]
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        invitation:
          $ref: "#/components/schemas/Invitation"

    SetTenantStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended]

    TenantMember:
      type: object
      additionalProperties: false
      required: [id, membershipId, fullName, username, role, active]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
          description: Global account ID; used only within the authorized tenant membership.
        membershipId:
          $ref: "#/components/schemas/UUID"
        fullName:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        active:
          type: boolean

    UpdateTenantMemberRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
        active:
          type: boolean

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"

    Invitation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          tenantId,
          role,
          expiresAt,
          createdAt,
          acceptedAt,
          revokedAt,
          initialOwner,
        ]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        tenantId:
          $ref: "#/components/schemas/UUID"
        role:
          $ref: "#/components/schemas/UserRole"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        initialOwner:
          type: boolean
        code:
          type: string
          readOnly: true
          description: Returned only once when issuing or reissuing a code. Never present in lists or audit.

    ReceiptIdentity:
      type: object
      additionalProperties: false
      required: [revision, businessName, address, phone]
      properties:
        revision:
          type: integer
          minimum: 1
        businessName:
          type: string
          minLength: 1
          maxLength: 160
        address:
          type: string
          maxLength: 500
        phone:
          type: string
          maxLength: 50

    TenantProfile:
      type: object
      additionalProperties: false
      required: [tenantId, revision, businessName, address, phone]
      properties:
        tenantId:
          $ref: "#/components/schemas/UUID"
        revision:
          type: integer
          minimum: 1
        businessName:
          type: string
          minLength: 1
          maxLength: 160
        address:
          type: string
          maxLength: 500
        phone:
          type: string
          maxLength: 50

    UpdateTenantProfileRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, businessName, address, phone]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        businessName:
          type: string
          minLength: 1
          maxLength: 160
        address:
          type: string
          maxLength: 500
        phone:
          type: string
          maxLength: 50

    TenantQRIS:
      type: object
      additionalProperties: false
      required: [tenantId, revision, payloadHash, staticPayload]
      properties:
        tenantId:
          $ref: "#/components/schemas/UUID"
        revision:
          type: integer
          minimum: 1
        payloadHash:
          $ref: "#/components/schemas/QrisPayloadHash"
        staticPayload:
          type: string
          minLength: 1
          maxLength: 4096

    TenantQRISConfig:
      type: object
      additionalProperties: false
      required: [revision, activePayloadHash, payloads]
      properties:
        revision:
          type: integer
          minimum: 0
        activePayloadHash:
          oneOf:
            - $ref: "#/components/schemas/QrisPayloadHash"
            - type: "null"
        payloads:
          type: array
          items:
            $ref: "#/components/schemas/TenantQRIS"

    UpdateTenantQRISRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, staticPayload]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        staticPayload:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        activate:
          type: boolean
          default: true

    UpdateOwnProfileRequest:
      type: object
      additionalProperties: false
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 160

    PlatformAuditEvent:
      type: object
      additionalProperties: false
      required: [id, eventType, actorId, tenantId, metadata, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        eventType:
          type: string
        actorId:
          type: [string, "null"]
          format: uuid
        tenantId:
          type: [string, "null"]
          format: uuid
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    SyncOrigin:
      type: object
      additionalProperties: false
      required: [originSessionId, originActorId, terminalId]
      properties:
        originSessionId:
          $ref: "#/components/schemas/UUID"
        originActorId:
          $ref: "#/components/schemas/UUID"
        terminalId:
          $ref: "#/components/schemas/UUID"

    RevalidatedOrigin:
      type: object
      additionalProperties: false
      required: [originSessionId, originActorId, terminalId, allowed]
      properties:
        originSessionId:
          $ref: "#/components/schemas/UUID"
        originActorId:
          $ref: "#/components/schemas/UUID"
        terminalId:
          $ref: "#/components/schemas/UUID"
        allowed:
          type: boolean

    RevalidateOriginsRequest:
      type: object
      additionalProperties: false
      required: [origins]
      properties:
        origins:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SyncOrigin"

    RevalidateOriginsResult:
      type: object
      additionalProperties: false
      required: [origins]
      properties:
        origins:
          type: array
          items:
            $ref: "#/components/schemas/RevalidatedOrigin"

    AvailableContextsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AvailableContexts"
        meta:
          $ref: "#/components/schemas/Meta"

    TenantContextEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/TenantContext"
        meta:
          $ref: "#/components/schemas/Meta"

    TenantEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Tenant"
        meta:
          $ref: "#/components/schemas/Meta"

    TenantListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        meta:
          $ref: "#/components/schemas/Meta"

    CreateTenantEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/CreateTenantResult"
        meta:
          $ref: "#/components/schemas/Meta"

    InvitationEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Invitation"
        meta:
          $ref: "#/components/schemas/Meta"

    InvitationListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        meta:
          $ref: "#/components/schemas/Meta"

    TenantMemberEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/TenantMember"
        meta:
          $ref: "#/components/schemas/Meta"

    TenantMemberListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TenantMember"
        meta:
          $ref: "#/components/schemas/Meta"

    TenantProfileEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/TenantProfile"
        meta:
          $ref: "#/components/schemas/Meta"

    TenantQRISConfigEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/TenantQRISConfig"
        meta:
          $ref: "#/components/schemas/Meta"

    PlatformAuditListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PlatformAuditEvent"
        meta:
          $ref: "#/components/schemas/Meta"

    RevalidateOriginsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/RevalidateOriginsResult"
        meta:
          $ref: "#/components/schemas/Meta"

    UUID:
      type: string
      format: uuid

    ULID:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      description: Canonical uppercase ULID without a display prefix.

    OperationID:
      type: string
      format: uuid
      description: Client-generated idempotency identity for a signed outbox mutation.

    Rupiah:
      type: integer
      format: int64
      minimum: 0
      description: Whole Indonesian rupiah; decimals are never accepted.

    UserRole:
      type: string
      enum: [admin, superadmin]
      description: Organization-wide account role, identical across all tenants. Admin operates and corrects/confirms their own transactions; Superadmin additionally administers staff, tenants, and all selected-tenant operations.

    DataMode:
      type: string
      enum: [production, sandbox]
      description: Server-authorized business data boundary bound to the session.

    DataSpaceStatus:
      type: string
      enum: [active, retired, purged]

    PaymentMethod:
      type: string
      enum: [cash, qris, legacy]
      description: |
        Stored payment method. `legacy` is read-only compatibility for
        transactions created before payment selection was introduced.

    SelectablePaymentMethod:
      type: string
      enum: [cash, qris]

    QrisPayloadHash:
      type: string
      minLength: 64
      maxLength: 64
      pattern: "^[0-9a-f]{64}$"
      description: |
        Lowercase SHA-256 digest of the exact configured static merchant QRIS
        payload. It binds a QRIS transaction revision to the exact payload used
        to generate its amount-specific QR code; it does not verify merchant
        ownership or payment settlement.

    PaymentStatus:
      type: string
      enum: [pending, success, failed]
      description: |
        Transactions are recorded as `success` from creation: there is no
        confirmation step, so freshly created and corrected revisions are
        immediately payable/printable. `pending` and `failed` remain only for
        legacy rows and explicit legacy payment updates.

    PaymentOutcome:
      type: string
      enum: [success, failed]

    PrintState:
      type: string
      enum: [pending, success, failed, unknown, needs-reprint]

    StatisticsPeriod:
      type: string
      enum: [day, week, month]

    ExportFormat:
      type: string
      enum: [xlsx, pdf]

    Meta:
      type: object
      additionalProperties: false
      required: [requestId, serverTime]
      properties:
        requestId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time

    PageMeta:
      type: object
      additionalProperties: false
      required: [requestId, serverTime, hasMore]
      properties:
        requestId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          description: ACCOUNT_ACCESS_CHANGED signals account deactivation, role change, or password recovery. Preserve and quarantine this scope's pending entries, then require fresh authentication; never replay another account's entries.
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          format: uuid

    RevisionConflictEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          allOf:
            - $ref: "#/components/schemas/ApiError"
            - type: object
              properties:
                code:
                  const: REVISION_CONFLICT
                details:
                  $ref: "#/components/schemas/RevisionConflictDetails"

    RevisionConflictDetails:
      type: object
      additionalProperties: false
      required: [baseRevision, currentRevision, localSnapshot, serverSnapshot]
      properties:
        baseRevision:
          type: integer
          minimum: 1
        currentRevision:
          type: integer
          minimum: 1
        localSnapshot:
          $ref: "#/components/schemas/TransactionSnapshot"
        serverSnapshot:
          $ref: "#/components/schemas/TransactionSnapshot"

    PaymentStateConflictEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          allOf:
            - $ref: "#/components/schemas/ApiError"
            - type: object
              properties:
                code:
                  const: PAYMENT_STATE_CONFLICT
                details:
                  $ref: "#/components/schemas/PaymentStateConflictDetails"

    PaymentStateConflictDetails:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          reason,
          baseRevision,
          currentRevision,
          requestedStatus,
          paymentStatus,
          paymentConfirmedRevision,
          serverSnapshot,
        ]
      properties:
        kind:
          type: string
          const: payment_state
        reason:
          type: string
          enum: [revision_changed, payment_final]
        baseRevision:
          type: integer
          minimum: 1
        currentRevision:
          type: integer
          minimum: 1
        requestedStatus:
          $ref: "#/components/schemas/PaymentOutcome"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        paymentConfirmedRevision:
          type: [integer, "null"]
          minimum: 1
        serverSnapshot:
          $ref: "#/components/schemas/TransactionSnapshot"

    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, postgres, redis]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        postgres:
          type: string
          enum: [ok, unavailable]
        redis:
          type: string
          enum: [ok, unavailable]

    HealthEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/HealthStatus"
        meta:
          $ref: "#/components/schemas/Meta"

    ActionResult:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    ActionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ActionResult"
        meta:
          $ref: "#/components/schemas/Meta"

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 256
        installationId:
          type: [string, "null"]
          format: uuid
          description: Client installation UUID used to look up an existing terminal binding.
        protocolVersion:
          type: integer
          enum: [2, 3]
          description: Compatible clients send 3 for organization-wide roles and transaction-total Sandbox QRIS. Version 2 retains fixed_1000 origin semantics. Omission supports only the migrated Telomoyo tenant.

    UpgradeSessionRequest:
      type: object
      additionalProperties: false
      required: [protocolVersion]
      properties:
        protocolVersion:
          type: integer
          const: 3

    SwitchModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/DataMode"

    LoginResult:
      type: object
      additionalProperties: false
      required:
        [
          sessionToken,
          sessionId,
          user,
          terminal,
          dataMode,
          dataSpaceId,
          sandboxGeneration,
          contextKind,
          tenantId,
          membershipId,
          tenant,
          isPlatformAdmin,
          protocolVersion,
          sandboxQrisPolicy,
        ]
      properties:
        contextKind:
          $ref: "#/components/schemas/ContextKind"
        tenantId:
          type: [string, "null"]
          format: uuid
        membershipId:
          type: [string, "null"]
          format: uuid
        tenant:
          oneOf:
            - $ref: "#/components/schemas/Tenant"
            - type: "null"
        isPlatformAdmin:
          type: boolean
          const: false
          deprecated: true
          description: Retained for legacy compatibility; Superadmin is the only organization-management role.
        protocolVersion:
          type: integer
          minimum: 0
          maximum: 3
        sandboxQrisPolicy:
          $ref: "#/components/schemas/SandboxQrisPolicy"
        sessionToken:
          type: string
          minLength: 43
          writeOnly: true
        sessionId:
          $ref: "#/components/schemas/UUID"
        user:
          $ref: "#/components/schemas/User"
        terminal:
          oneOf:
            - $ref: "#/components/schemas/Terminal"

    TransactionSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          occurredAt,
          paymentMethod,
          paymentStatus,
          paymentConfirmedRevision,
          items,
          subtotal,
          total,
          paymentAmount,
        ]
      properties:
        occurredAt:
          type: string
          format: date-time
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
          description: Immutable revisions created before payment tracking are read-normalized to `legacy`.
        qrisPayloadHash:
          $ref: "#/components/schemas/QrisPayloadHash"
          description: Present only when this revision is bound to a QRIS merchant payload.
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
          description: Immutable legacy revisions are read-normalized to `success`.
        paymentConfirmedRevision:
          type: [integer, "null"]
          minimum: 1
          description: The snapshot revision when payment succeeded; null until payment succeeds.
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TransactionItemSnapshot"
        subtotal:
          $ref: "#/components/schemas/Rupiah"
        total:
          $ref: "#/components/schemas/Rupiah"
        paymentAmount:
          $ref: "#/components/schemas/Rupiah"
          description: |
            Immutable amount presented for this revision. It equals `total`
            except legacy fixed_1000 Sandbox QRIS revisions, which retain Rp1.000.
            The signed origin session determines the policy for new revisions.

    TransactionRevision:
      type: object
      additionalProperties: false
      required:
        [
          id,
          transactionId,
          revision,
          reason,
          before,
          after,
          originActor,
          submittedBy,
          terminal,
          clientOccurredAt,
          serverReceivedAt,
        ]
      properties:
        receiptIdentity:
          $ref: "#/components/schemas/ReceiptIdentity"
        id:
          $ref: "#/components/schemas/UUID"
        transactionId:
          $ref: "#/components/schemas/ULID"
        revision:
          type: integer
          minimum: 2
        reason:
          type: string
          minLength: 5
          maxLength: 500
        qrisPayloadHash:
          $ref: "#/components/schemas/QrisPayloadHash"
          description: Present only for a QRIS revision created after payload binding was introduced.
        before:
          $ref: "#/components/schemas/TransactionSnapshot"
        after:
          $ref: "#/components/schemas/TransactionSnapshot"
        originActor:
          $ref: "#/components/schemas/UserSummary"
        submittedBy:
          $ref: "#/components/schemas/UserSummary"
        terminal:
          $ref: "#/components/schemas/TerminalSummary"
        clientOccurredAt:
          type: string
          format: date-time
        serverReceivedAt:
          type: string
          format: date-time


          format: date-time
        deletedBy:
          $ref: "#/components/schemas/UserSummary"
        reason:
          type: string

    Transaction:
      type: object
      additionalProperties: false
      required:
        [
          id,
          displayId,
          revision,
          occurredAt,
          items,
          subtotal,
          total,
          paymentAmount,
          paymentMethod,
          paymentStatus,
          paymentConfirmedRevision,
          originActor,
          updatedBy,
          terminal,
          print,
          deletion,
          createdAt,
          updatedAt,
        ]
      properties:
        receiptProfileRevision:
          type: integer
          minimum: 1
          description: Immutable business-profile selection captured at creation; absent on legacy transactions.
        receiptIdentity:
          $ref: "#/components/schemas/ReceiptIdentity"
        id:
          $ref: "#/components/schemas/ULID"
        displayId:
          type: string
          description: Display identity; Sandbox transactions use a `TEST-` prefix.
        revision:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TransactionItem"
        subtotal:
          $ref: "#/components/schemas/Rupiah"
        total:
          $ref: "#/components/schemas/Rupiah"
        paymentAmount:
          $ref: "#/components/schemas/Rupiah"
          description: |
            Amount actually presented to the payer. Cash, Production QRIS, and
            transaction_total Sandbox QRIS equal the revision total. Legacy
            fixed_1000 Sandbox QRIS retains its stored Rp1.000 amount.
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        qrisPayloadHash:
          $ref: "#/components/schemas/QrisPayloadHash"
          description: Present only for a QRIS revision created after payload binding was introduced.
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        paymentConfirmedRevision:
          type: [integer, "null"]
          minimum: 1
          description: |
            The transaction revision confirmed by a successful payment. It is
            null while payment is pending or failed.
        originActor:
          $ref: "#/components/schemas/UserSummary"
        updatedBy:
          $ref: "#/components/schemas/UserSummary"
        terminal:
          $ref: "#/components/schemas/TerminalSummary"
        print:
          $ref: "#/components/schemas/PrintMetadata"
        deletion:
          oneOf:
            - $ref: "#/components/schemas/DeletionMetadata"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


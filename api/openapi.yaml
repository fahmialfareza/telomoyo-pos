      properties:
        period:
          $ref: "#/components/schemas/StatisticsPeriod"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        grossRevenue:
          $ref: "#/components/schemas/Rupiah"
          description: Simulated package total for the selected data space.
        actualQrisAmount:
          $ref: "#/components/schemas/Rupiah"
          description: Actual successful QRIS charges for reconciliation; cash is excluded.
        transactionCount:
          type: integer
          minimum: 0
        packageQuantities:
          type: array
          items:
            $ref: "#/components/schemas/PackageQuantity"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/TrendBucket"
        recent:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/Transaction"

    DashboardStatisticsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/DashboardStatistics"
        meta:
          $ref: "#/components/schemas/Meta"

    TransactionFilter:
      type: object
      additionalProperties: false
      properties:
        search:
          type: string
          maxLength: 30
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        packageId:
          $ref: "#/components/schemas/UUID"
        creatorId:
          $ref: "#/components/schemas/UUID"
        terminalId:
          $ref: "#/components/schemas/UUID"
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        includeDeleted:
          type: boolean
          default: false

    ExportTransactionsRequest:
      type: object
      additionalProperties: false
      required: [format, filters]
      properties:
        format:
          $ref: "#/components/schemas/ExportFormat"
        filters:
          $ref: "#/components/schemas/TransactionFilter"

    TerminalSummary:
      type: object
      additionalProperties: false
      required: [id, installationId, name]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        installationId:
          type: string
          format: uuid
          description: Stable client installation UUID distinct from the server terminal UUID.
        name:
          type: string

    Terminal:
      type: object
      additionalProperties: false
      required:
        [
          id,
          installationId,
          name,
          publicKey,
          algorithm,
          platform,
          active,
          enrolledAt,
          revokedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        installationId:
          type: string
          format: uuid
          description: Stable client installation UUID distinct from the server terminal UUID.
        name:
          type: string
        publicKey:
          type: string
          contentEncoding: base64
          minLength: 43
          maxLength: 44
          description: Standard or unpadded standard Base64 encoding of the 32-byte Ed25519 public key.
        algorithm:
          type: string
          const: Ed25519
        platform:
          type: string
          const: android
        deviceModel:
          type: string
          maxLength: 120
        osVersion:
          type: string
          maxLength: 50
        appVersion:
          type: string
          maxLength: 50
        active:
          type: boolean
        enrolledAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time

    EnrollTerminalRequest:
      type: object
      additionalProperties: false
      required: [installationId, name, publicKey, algorithm]
      properties:
        installationId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        publicKey:
          type: string
          contentEncoding: base64
          minLength: 43
          maxLength: 44
        algorithm:
          type: string
          const: Ed25519
        deviceModel:
          type: string
          minLength: 1
          maxLength: 120
        osVersion:
          type: string
          minLength: 1
          maxLength: 50
        appVersion:
          type: string
          minLength: 1
          maxLength: 50

    TerminalEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Terminal"
        meta:
          $ref: "#/components/schemas/Meta"

    SyncAggregate:
      type: string
      enum: [transaction, print_attempt]

    SyncAction:
      type: string
      enum: [create, correct, set_payment_status]
      description: |
        Print attempts use `aggregate: print_attempt` with `action: create`.
        As a temporary, telemetry-backed compatibility path, the server accepts a
        truly absent `paymentMethod` only for an already-signed transaction
        `create` or `correct` queued before 2026-07-29 WIB by a terminal enrolled
        before that rollout. Server acceptance ends after 2026-08-12 WIB.
        Explicit `null` is rejected. Current clients must always send `cash` or
        `qris`.

    CreateTransactionMutationPayload:
      type: object
      additionalProperties: false
      required: [id, paymentMethod, items]
      properties:
        receiptProfileRevision:
          type: integer
          minimum: 1
          description: Tenant business-profile revision captured when the offline operation was created. Existing signed legacy payloads remain valid without this field.
        id:
          $ref: "#/components/schemas/ULID"
        paymentMethod:
          $ref: "#/components/schemas/SelectablePaymentMethod"
          description: Required for current clients; explicit null is never accepted.
        qrisPayloadHash:
          $ref: "#/components/schemas/QrisPayloadHash"
          description: Required when `paymentMethod` is `qris`; omit for `cash`.
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TransactionLineInput"

    CorrectTransactionMutationPayload:
      type: object
      additionalProperties: false
      required: [id, reason, paymentMethod, items]
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        reason:
          type: string
          minLength: 5
          maxLength: 500
        paymentMethod:
          $ref: "#/components/schemas/SelectablePaymentMethod"
          description: Required for current clients; explicit null is never accepted.
        qrisPayloadHash:
          $ref: "#/components/schemas/QrisPayloadHash"
          description: Required when `paymentMethod` is `qris`; omit for `cash`.
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TransactionLineInput"

    SetPaymentStatusMutationPayload:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        status:
          $ref: "#/components/schemas/PaymentOutcome"

    PrintAttemptMutationPayload:
      type: object
      additionalProperties: false
      required:
        [id, transactionId, transactionRevision, status, printerKind, isCopy]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        transactionId:
          $ref: "#/components/schemas/ULID"
        transactionRevision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, success, failed, unknown]
        printerKind:
          $ref: "#/components/schemas/PrinterKind"
        printerIdentifier:
          type: [string, "null"]
          maxLength: 200
        isCopy:
          type: boolean
        errorCode:
          type: [string, "null"]
          maxLength: 100
        errorMessage:
          type: [string, "null"]
          maxLength: 500
        metadata:
          type: object
          additionalProperties: true

    SyncMutationSignedBody:
      type: object
      description: |
        The exact object canonicalized with RFC 8785 and signed as UTF-8. It contains
        exactly these ten properties, including `baseRevision: null` for creates.
        `occurredAt` is normalized to UTC with exactly millisecond precision before
        canonicalization.
      required:
        [
          operationId,
          aggregate,
          aggregateId,
          action,
          baseRevision,
          originSessionId,
          originActorId,
          terminalId,
          occurredAt,
          payload,
        ]
      properties:
        operationId:
          $ref: "#/components/schemas/OperationID"
        aggregate:
          $ref: "#/components/schemas/SyncAggregate"
        aggregateId:
          type: string
          minLength: 1
          maxLength: 64
          description: Transaction ULID for transactions; print-attempt UUID for print attempts.
        action:
          $ref: "#/components/schemas/SyncAction"
        baseRevision:
          type: [integer, "null"]
          minimum: 1
        originSessionId:
          $ref: "#/components/schemas/UUID"
        originActorId:
          $ref: "#/components/schemas/UUID"
        terminalId:
          $ref: "#/components/schemas/UUID"
        occurredAt:
          type: string
          format: date-time
        payload:
          oneOf:
            - $ref: "#/components/schemas/CreateTransactionMutationPayload"
            - $ref: "#/components/schemas/CorrectTransactionMutationPayload"
            - $ref: "#/components/schemas/SetPaymentStatusMutationPayload"
            - $ref: "#/components/schemas/PrintAttemptMutationPayload"

    SyncMutation:
      unevaluatedProperties: false
      description: |
        A signed outbox operation. `signature` is standard Base64 of the 64-byte
        Ed25519 signature over the RFC 8785 canonical JSON represented by
        `SyncMutationSignedBody`; the signature property itself is never signed.
      allOf:
        - $ref: "#/components/schemas/SyncMutationSignedBody"
        - type: object
          required: [signature]
          properties:
            signature:
              type: string
              contentEncoding: base64
              minLength: 86
              maxLength: 88

    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [mutations]
      properties:
        mutations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SyncMutation"

    SyncMutationStatus:
      type: string
      enum: [applied, duplicate, conflict, rejected]

    SyncMutationResult:
      type: object
      additionalProperties: false
      required:
        [operationId, aggregateId, status, replayed, data, conflict, error]
      properties:
        operationId:
          $ref: "#/components/schemas/OperationID"
        aggregateId:
          type: string
        status:
          $ref: "#/components/schemas/SyncMutationStatus"
        replayed:
          type: boolean
        data:
          oneOf:
            - $ref: "#/components/schemas/Transaction"
            - $ref: "#/components/schemas/PrintAttempt"
            - type: "null"
        conflict:
          oneOf:
            - $ref: "#/components/schemas/RevisionConflictDetails"
            - $ref: "#/components/schemas/PaymentStateConflictDetails"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"

    SyncPushResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncMutationResult"

    SyncPushEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SyncPushResult"
        meta:
          $ref: "#/components/schemas/Meta"

    SyncChange:
      type: object
      additionalProperties: false
      required:
        [
          cursor,
          aggregate,
          action,
          aggregateId,
          revision,
          changedAt,
          tombstone,
          payload,
        ]
      properties:
        cursor:
          type: string
          description: |
            Durable tenant/data-space-bound cursor after this individual change:
            `tenant:<tenantUUID>:<spaceUUID>:<generation>:<position>`.
        aggregate:
          type: string
          enum:
            [
              user,
              package,
              transaction,
              print_attempt,
              terminal,
              tenant_profile,
              tenant_qris,
              tenant_metadata,
            ]
        action:
          type: string
          enum: [upsert, delete]
        aggregateId:
          type: string
        revision:
          type: [integer, "null"]
          minimum: 1
        changedAt:
          type: string
          format: date-time
        tombstone:
          type: boolean
        payload:
          oneOf:
            - $ref: "#/components/schemas/User"
            - $ref: "#/components/schemas/Package"
            - $ref: "#/components/schemas/Transaction"
            - $ref: "#/components/schemas/PrintAttempt"
            - $ref: "#/components/schemas/Terminal"
            - $ref: "#/components/schemas/TenantProfile"
            - $ref: "#/components/schemas/TenantQRISConfig"
            - $ref: "#/components/schemas/Tenant"
            - type: "null"

    SyncPullResult:
      type: object
      additionalProperties: false
      required: [changes, cursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
        cursor:
          type: string
          description: |
            Cursor bound to tenant and data space, in the form
            `tenant:<tenantUUID>:<spaceUUID>:<generation>:<position>`.
            The migrated Telomoyo tenant alone accepts legacy decimal Production
            cursors and `sandbox:<generation>:<position>` Sandbox cursors.
        hasMore:
          type: boolean

    SyncPullEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SyncPullResult"
        meta:
          $ref: "#/components/schemas/Meta"

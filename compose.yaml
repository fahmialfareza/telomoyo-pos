name: telomoyo-pos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sewa_motor}
      POSTGRES_USER: ${POSTGRES_USER:-sewa_motor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sewa_motor_dev_only}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    profiles: ["app"]
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-sewa_motor}:${POSTGRES_PASSWORD:-sewa_motor_dev_only}@postgres:5432/${POSTGRES_DB:-sewa_motor}?sslmode=disable"
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Asia/Jakarta}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-sewa-motor-backend}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: ${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-true}
      NEW_RELIC_LOG_FORWARDING_ENABLED: ${NEW_RELIC_LOG_FORWARDING_ENABLED:-true}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      TENANT_PROVISIONING_ENABLED: ${TENANT_PROVISIONING_ENABLED:-false}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_RETENTION_DAYS: ${SANDBOX_RETENTION_DAYS:-30}
      SANDBOX_QRIS_AMOUNT: ${SANDBOX_QRIS_AMOUNT:-1000}
      SANDBOX_CLEANUP_INTERVAL: ${SANDBOX_CLEANUP_INTERVAL:-24h}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      SESSION_CACHE_TTL: ${SESSION_CACHE_TTL:-15m}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-1m}
      PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-1}
      GOMEMLIMIT: ${GOMEMLIMIT:-400MiB}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER:-development-session-pepper-change-me}
      TERMINAL_ENROLLMENT_SECRET: ${TERMINAL_ENROLLMENT_SECRET:-development-enrollment-secret-change-me}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres-data:
